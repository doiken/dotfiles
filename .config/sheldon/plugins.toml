shell = "zsh"

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ["fpath"]

# compinit は fzf-tab より前・fpath 完成後に実行する必要がある。
# 補完定義の変化を検知した時だけフル再生成し、通常は -C で検査をスキップする。
# - 全 fpath: ディレクトリ mtime(brew の relink・git pull 等の追加/削除/置換を検知)
# - ~/.zsh/completion(自作)だけはファイル mtime も見て、その場編集も検知する
[plugins.compinit]
inline = '''
autoload -Uz compinit
() {
  local dump=$HOME/.zcompdump f
  local rebuild=0
  if [[ -f $dump ]]; then
    for f in ${^fpath}(N-/) ~/.zsh/completion/*(N.); do
      [[ $f -nt $dump ]] && { rebuild=1; break }
    done
  else
    rebuild=1
  fi
  if (( rebuild )); then
    rm -f $dump
    compinit
  else
    compinit -C
  fi
}
'''

[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# 他プラグインより後に読み込む必要がある(旧 zplug の defer:2 相当)
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
