##
## Global Setting
##

## Inherit Environment Variable
# __CFBundleIdentifier は端末アプリの Bundle ID。通知のフォーカス先として
# .claude/scripts/notify.sh が参照する。tmux サーバは起動元アプリの値を保持し続けるため、
# ここに登録して new-session / attach のたびに更新させる。
set-option -ga update-environment ' DOCKER_HOST DOCKER_CERT_PATH DOCKER_TLS_VERIFY __CFBundleIdentifier'

## Option
set -g display-time 6000
set -g status-interval 30
set -g history-limit 50000
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -s terminal-features ",*:hyperlinks"
set -sa terminal-features ",*:RGB" # truecolor (delta/bat の 24bit 色)
set -s focus-events on             # vim の autoread をフォーカス復帰時に発火
set -g destroy-unattached on # detach 時に session を終了
setw -g mode-keys vi
setw -g mouse on

## popup
set -g popup-border-lines rounded          # 角丸枠。他: double / heavy / simple / padded
set -g popup-border-style 'fg=cyan'        # 枠線色(status 行の cyan と統一)
set -g popup-style 'bg=colour235'          # popup 内の背景を少し暗くして本体と区別

## Customize Prefix
unbind-key C-b
set -g prefix C-g
bind-key C-g send-prefix

## Reload Config
bind r source-file ~/.tmux.conf \; display-message "Reload Config!!"

## Status Line
set -g status-right "#(w | head -1 | cut -d, -f4) | %Y/%m/%d (%a) %p %I:%M"
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W_#P"
set -g status-style bg=black,fg=cyan
set -g status-left-style fg=black,bg=magenta
set -g status-right-style fg=black,bg=green
set-window-option -g window-status-current-style bright,reverse,bg=cyan,fg=black

## title
set -g set-titles on                          # 外側ターミナルへタイトル転送
set -g set-titles-string "#{=/25/…:pane_title}"
set -g allow-passthrough on                   # tmux 3.3+ / 通知等の透過

##
## Key Settings
##

## Control Pane
bind-key -r k resize-pane -U 5
bind-key -r j resize-pane -D 5
bind-key -r h resize-pane -L 5
bind-key -r l resize-pane -R 5
bind-key C-i select-pane -t :.+
bind-key Escape copy-mode

## Syncronize
bind-key a set-window-option synchronize-panes on
bind-key A set-window-option synchronize-panes off

## Commands
bind-key    C-L clear-history

## Manipulate Pane/Window
bind-key    t   new-window
bind-key    D   split-window -v
bind-key    d   split-window -h
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-h select-pane -L
bind-key -n M-l select-pane -R
bind-key -n M-H select-window -p
bind-key -n M-L select-window -n

## Clip Board Combination
bind-key -n M-[ copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

## Clip Board Combination for Mouse Selection
bind-key C-c run-shell "tmux save-buffer - | pbcopy"
bind-key C-v run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"

## Claude Code integration
bind-key  -n C-x switch-client -T custom_commands

bind-key -T custom_commands w split-window -h 'watch_theme'
bind-key -T custom_commands s display-popup -E -x R -y P -w 75% -h 15% -T "watch_theme" "claude_session save; read -t 5 -s -k 1"

